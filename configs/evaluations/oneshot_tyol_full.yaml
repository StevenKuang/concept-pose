# TYOL Full Test: All 2000 pairs from Oryon's cross_scene_test split
# Evaluates one-shot pose estimation on full TYOL (ToyotaLight) dataset

name: oneshot_tyol_full
mode: oneshot
description: TYOL full test - all 2000 pairs from Oryon cross_scene_test split

# Dataset configuration
dataset:
  type: tyol
  config: configs/datasets/tyol.json

# Object semantic labels configuration
object:
  num_semantic_labels: 15

# Test pairs configuration - Load all pairs from Oryon's fixed split
pairs:
  sampling:
    mode: oryon_fixed_tyol_split
    split_name: cross_scene_test
    num_pairs: null  # null = load all 2000 pairs
    oryon_root: data/oryon_data/toyl # oryon got it wrong so keep it toyl here

# Pose estimation parameters
estimation:
  voxel_resolution: 64
  ransac_iterations: 100000
  ransac_threshold: 0.01
  similarity_threshold: -2  # no filtering
  max_correspondences: 10000
  use_icp: true
  anchor_pose_mode: relative  # Relative mode for camera-space model building
  voxelize_anchor: false
  voxelize_query: false

# Evaluation metrics configuration
metrics:
  renderer: pytorch3d
  device: cuda

# Mask generation settings
mask_generation:
  use_gt_masks: true
  simplify_prompts: true
  save_failed_masks: false

# Output configuration
output:
  results_file: results_tyol_full_2000_novox.json
  visualize: false  # Disable visualization for full test (2000 images is too many)
  viz_dir: models/viz_tyol_test_full
  max_pairs: null

# Execution options
device: cuda
num_workers: 0
